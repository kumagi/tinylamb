name = "TinylambOpt"
version = "0.1.0"
keywords = ["database", "optimizer", "sql"]
defaultTargets = ["TinylambOpt", "demo", "CheckProofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false

[[lean_lib]]
name = "TinylambOpt"

[[lean_exe]]
name = "demo"
root = "Main"

[[lean_lib]]
name = "CheckProofs"
