\* Publish an S3 checkpoint past the S3 durable LSN. Expected: violation.
SPECIFICATION Spec
CONSTANTS
    Hosts = {"A", "B"}
    InitOwner = "A"
    MaxRecs = 3
    MaxEpoch = 3
    Window = 2
    MaxCrashes = 2
    MaxTransfers = 2
    LocalFsyncHolds = TRUE
    AckNonContiguous = FALSE
    SameEpochRestart = FALSE
    NoSealMarker = FALSE
    Trust412 = FALSE
    ReuseAnyLocal = FALSE
    CkptBeyondS3 = TRUE
    ChaseNewerEpoch = FALSE
    NoTargetCheck = FALSE
    SealsDeletable = FALSE
    ReuseTail = FALSE
INVARIANTS
    NoLostAck
    DurableIsOfficial
    RestoredIsOfficial
    ActiveWriterAgrees
    EpochsAbut
    CkptConsistent
    NoConflict
    ActiveEpochUnsealed
PROPERTIES
    HistoryMonotone
CHECK_DEADLOCK FALSE
