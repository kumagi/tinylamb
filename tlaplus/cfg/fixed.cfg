\* Commit durability barrier: wait for the contributing kCommit before any blocks write. Expected: all invariants hold.
SPECIFICATION Spec
CONSTANTS
    NumPages = 1
    NumSlots = 2
    NumTxns = 2
    MaxCrashes = 2
    MaxCheckpoints = 1
    WalBeforeDataMode = "commit"
    CheckStaleOnPublish = TRUE
    CheckGenOnPublish = TRUE
    KeepRegisteredUntilPublished = TRUE
INVARIANTS
    CommittedStateCorrect
    LiveStateCorrect
    EvictedPageReadable
    CheckpointReadable
    WalBeforeData
    AckedIsDurable
    SpillOnlyForEvicted
CHECK_DEADLOCK FALSE
