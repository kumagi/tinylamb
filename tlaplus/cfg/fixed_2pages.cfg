\* Commit durability barrier with 2 pages (cross-page eviction/checkpoint ordering). Heavier.
SPECIFICATION Spec
CONSTANTS
    NumPages = 2
    NumSlots = 1
    NumTxns = 2
    MaxCrashes = 1
    MaxCheckpoints = 1
    WalBeforeDataMode = "commit"
    CheckStaleOnPublish = TRUE
    CheckGenOnPublish = TRUE
    KeepRegisteredUntilPublished = TRUE
INVARIANTS
    CommittedStateCorrect
    LiveStateCorrect
    EvictedPageReadable
    CheckpointReadable
    WalBeforeData
    AckedIsDurable
    SpillOnlyForEvicted
CHECK_DEADLOCK FALSE
