\* Pre-fix barrier on two pages; check restart consistency.
SPECIFICATION Spec
CONSTANTS
    NumPages = 2
    NumSlots = 1
    NumTxns = 1
    MaxCrashes = 1
    MaxCheckpoints = 1
    WalBeforeDataMode = "record"
    CheckStaleOnPublish = TRUE
    CheckGenOnPublish = TRUE
    KeepRegisteredUntilPublished = TRUE
INVARIANTS
    CommittedStateCorrect
    LiveStateCorrect
    EvictedPageReadable
    CheckpointReadable
    AckedIsDurable
    SpillOnlyForEvicted
CHECK_DEADLOCK FALSE
