version: 2
updates:
  # Keep every `uses:` (workflows and the composite action) on current
  # releases. Grouped so a week of bumps arrives as a single PR.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
