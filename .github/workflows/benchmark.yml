name: benchmark
on:
  workflow_dispatch:
  schedule:
    # Every Monday 03:00 UTC (weekly)
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tpch-sf1:
    # P3-1 benchmark regression gate. SF=1 fixed; bench_gate.py compares
    # per-query times (and the q1..q22 sum) against BenchmarkHistory.md.
    # GitHub-hosted runners are noisy: authoritative numbers come from
    # evo-x2; this job only catches order-of-magnitude regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # LLVM 21 + JIT ON: the Release engine relies on the ORC kernels.
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: bench-release

      - name: Build TPC-H driver (Release)
        run: |
          cmake -S . -B build-rel \
            -DCMAKE_BUILD_TYPE=Release \
            -DTINYLAMB_ENABLE_GOOGLESQL=ON
          cmake --build build-rel --target tinylamb_tpch_benchmark

      - name: Run TPC-H SF=1 (load + Q1-Q22)
        working-directory: build-rel
        run: |
          set -o pipefail
          ./tinylamb_tpch_benchmark ./tpch-run/sf1 \
            --scale-factor 1 --force | tee tpch-sf1.log

      - name: Convert TPCH_PROFILE output to TSV + job summary
        working-directory: build-rel
        run: |
          python3 - <<'EOF'
          import os, re, sys
          total_ms = 0.0
          rows = []
          for line in open("tpch-sf1.log", encoding="utf-8"):
              m = re.match(r"TPCH_PROFILE Q(\d+) ([0-9.]+) ms", line)
              if m:
                  q, ms = int(m.group(1)), float(m.group(2))
                  total_ms += ms
                  rows.append((q, ms))
          if not rows:
              sys.exit("no TPCH_PROFILE lines found; benchmark did not run")
          with open("results.tsv", "w", encoding="utf-8") as out:
              for q, ms in sorted(rows):
                  out.write(f"q{q}_ms\t{ms}\n")
              out.write(f"query_sum_q1_q22\t{total_ms / 1000.0}\n")
          print(open("results.tsv").read())
          peak = max(ms for _, ms in rows)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("## TPC-H SF=1 (GitHub runner, cold)\n\n")
              s.write(f"**Σ Q1–Q22: {total_ms / 1000.0:.2f} s**\n\n")
              s.write("| query | ms | |\n|---|---:|---|\n")
              for q, ms in sorted(rows):
                  bar = "█" * max(1, round(20 * ms / peak))
                  s.write(f"| Q{q} | {ms:.1f} | `{bar}` |\n")
          EOF

      - name: Regression gate (fail on >10% slowdown vs BenchmarkHistory.md)
        run: |
          python3 scripts/bench_gate.py \
            --history BenchmarkHistory.md \
            --results build-rel/results.tsv \
            --threshold-pct 10

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tpch-sf1-results
          path: |
            build-rel/tpch-sf1.log
            build-rel/results.tsv
          if-no-files-found: ignore
