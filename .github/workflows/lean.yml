name: Lean proofs
on:
  push:
    branches: [master]
    paths: ['lean/**', '.github/workflows/lean.yml']
  pull_request:
    paths: ['lean/**', '.github/workflows/lean.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # lean-action installs elan at the version pinned by lean/lean-toolchain
      # and caches .lake between runs, so unchanged proofs are not re-checked.
      - uses: leanprover/lean-action@v1.7.1
        with:
          lake-package-directory: lean
          build: true
          test: false
          lint: false
          use-github-cache: true
