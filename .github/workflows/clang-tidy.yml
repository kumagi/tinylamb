name: clang-tidy
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang clang-tidy clang-tools

      - name: configure
        run: CC=clang CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTINYLAMB_ENABLE_GOOGLESQL=OFF

      - name: clang-tidy diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          # Ubuntu 24.04 ships the diff helper under a versioned name
          # (clang-tidy-diff-18.py); pick whichever is present.  It is a
          # Python script and need not carry the executable bit, so run it
          # through python3 instead of testing -x.
          TIDY_DIFF=$(command -v clang-tidy-diff.py || ls /usr/bin/clang-tidy-diff*.py 2>/dev/null | head -1 || true)
          if [ -z "$TIDY_DIFF" ]; then
            echo "clang-tidy-diff helper not found" >&2
            exit 1
          fi
          if [ -n "$PR_BASE" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git hash-object -w -t tree /dev/null)
          else
            BASE="$PUSH_BASE"
          fi
          CHANGED=$(git diff --no-prefix -U0 "$BASE" HEAD -- '*.cpp' '*.hpp')
          if [ -z "$CHANGED" ]; then
            echo "no C++ diff"
            exit 0
          fi
          printf '%s\n' "$CHANGED" | \
            python3 "$TIDY_DIFF" -path build -quiet -j "$(nproc)"
