name: clang-tidy
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain
        with:
          extra-packages: clang-tidy-21 clang-tools-21

      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTINYLAMB_ENABLE_GOOGLESQL=OFF

      - name: clang-tidy diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Use the helper and binary of the pinned LLVM so the diff driver
          # and the checks always come from the same release.
          TIDY_DIFF=/usr/bin/clang-tidy-diff-21.py
          if [ ! -f "$TIDY_DIFF" ]; then
            echo "::error::clang-tidy-diff helper not found: $TIDY_DIFF"
            exit 1
          fi
          if [ -n "$PR_BASE" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [ -z "$PUSH_BASE" ] || [ "$PUSH_BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)
          else
            BASE="$PUSH_BASE"
          fi
          CHANGED=$(git diff --no-prefix -U0 "$BASE" HEAD -- '*.cpp' '*.hpp')
          if [ -z "$CHANGED" ]; then
            echo "no C++ diff" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CHANGED was produced with --no-prefix, so its '+++' lines carry
          # no a/ or b/ component. clang-tidy-diff defaults to -p1 and would
          # match none of them, reporting "No relevant changes found" with a
          # success exit code. -p0 keeps the CI job from passing vacuously.
          set -o pipefail
          printf '%s\n' "$CHANGED" | \
            python3 "$TIDY_DIFF" -p0 -path build -quiet -j "$(nproc)" \
              -clang-tidy-binary clang-tidy-21 | tee clang-tidy.log

      - name: Annotate findings
        if: failure()
        run: |
          # file:line:col: warning|error: message [check]
          # Annotations need repo-relative paths; clang-tidy prints absolute.
          [ -f clang-tidy.log ] || exit 0
          grep -E '^[^ ]+:[0-9]+:[0-9]+: (warning|error):' clang-tidy.log | sort -u | head -50 | \
            sed -E "s#^${GITHUB_WORKSPACE}/##" | \
            sed -E 's#^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$#::\4 file=\1,line=\2,col=\3,title=clang-tidy::\5#' || true
