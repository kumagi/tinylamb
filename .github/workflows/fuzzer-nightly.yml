name: fuzzer-nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build fuzzers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTINYLAMB_ENABLE_FUZZ=ON \
            -DTINYLAMB_ENABLE_GOOGLESQL=OFF
          cmake --build build-fuzz -j"$(nproc)" --target table_fuzzer value_fuzzer

      - name: short fuzz run
        run: |
          ./build-fuzz/table_fuzzer -runs=1000 -max_total_time=60 || true
          ./build-fuzz/value_fuzzer -runs=1000 -max_total_time=60 || true
