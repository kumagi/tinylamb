name: fuzzer-nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target (seconds)
        default: "600"
      filter:
        description: Only run fuzzers whose name matches this regex
        default: "."

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FUZZ_BUILD_TYPE: RelWithDebInfo

jobs:
  # Builds every libFuzzer target once to warm ccache, and derives the matrix
  # from the add_fuzzer_test() calls in CMakeLists.txt so new fuzzers are
  # picked up without touching this file.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      fuzzers: ${{ steps.list.outputs.fuzzers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: list fuzz targets
        id: list
        env:
          FILTER: ${{ inputs.filter || '.' }}
        run: |
          names=$(grep -oE '^add_fuzzer_test\([^ )]+' CMakeLists.txt \
                    | sed -E 's/^add_fuzzer_test\(//; s#.*/##; s/\.cpp$//' \
                    | grep -E -- "$FILTER" | sort -u)
          if [ -z "$names" ]; then echo "::error::no fuzz targets selected"; exit 1; fi
          echo "fuzzers=$(printf '%s\n' "$names" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          {
            echo "### Fuzz targets"
            while read -r n; do echo "- \`$n\`"; done <<< "$names"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$names" > fuzz-targets.txt

      # libFuzzer needs clang: GCC dropped -fsanitize=fuzzer.
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: fuzz
          ccache-max-size: 4G
          ccache-save: "true"

      # GoogleSQL stays ON: the SQL / OOC session fuzzers drive the real
      # frontend, and OFF turns them into parse-error generators.
      - name: build fuzzers
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE="$FUZZ_BUILD_TYPE" \
            -DTINYLAMB_ENABLE_FUZZ=ON
          # shellcheck disable=SC2046
          cmake --build build-fuzz --target $(cat fuzz-targets.txt)

  fuzz:
    name: fuzz ${{ matrix.fuzzer }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        fuzzer: ${{ fromJSON(needs.build.outputs.fuzzers) }}
    env:
      FUZZER: ${{ matrix.fuzzer }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restores the cache the build job just saved; only the link step and
      # cache lookups run here.
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: fuzz
          ccache-max-size: 4G
          ccache-save: "false"

      - name: build ${{ matrix.fuzzer }}
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE="$FUZZ_BUILD_TYPE" \
            -DTINYLAMB_ENABLE_FUZZ=ON
          cmake --build build-fuzz --target "$FUZZER"

      - name: restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work/corpus
          key: fuzz-corpus-${{ matrix.fuzzer }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.fuzzer }}-

      - name: fuzz
        id: fuzz
        run: |
          mkdir -p fuzz-work/corpus fuzz-work/artifacts
          cd fuzz-work   # fuzzers open databases via relative paths
          set +e
          "$GITHUB_WORKSPACE/build-fuzz/$FUZZER" corpus \
            -fork="$(nproc)" \
            -max_total_time="$SECONDS_PER_TARGET" \
            -timeout=60 -rss_limit_mb=4096 \
            -artifact_prefix="$PWD/artifacts/" \
            -print_final_stats=1 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          set -e
          n=$(find corpus -type f | wc -l)
          crashes=$(find artifacts -type f | wc -l)
          {
            if [ "$rc" -eq 0 ]; then echo "### ✅ $FUZZER"; else echo "### ❌ $FUZZER (exit $rc)"; fi
            echo
            echo "| corpus | findings | time budget |"
            echo "|---:|---:|---:|"
            echo "| $n | $crashes | ${SECONDS_PER_TARGET}s |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=fuzz finding::$FUZZER exited with $rc ($crashes artifact(s)); see the fuzz-findings-$FUZZER artifact"
            # Keep the stack trace next to the reproducer.
            tail -n 200 fuzz.log > artifacts/stack-trace.txt
          fi
          exit "$rc"

      # Save the grown corpus even when a crash ended the run.
      - name: save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-work/corpus
          key: fuzz-corpus-${{ matrix.fuzzer }}-${{ github.run_id }}

      - name: upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.fuzzer }}
          path: fuzz-work/artifacts/
          retention-days: 30

  # Nightly runs have nobody watching: turn a red night into a tracked issue
  # (one open issue per day, reused if it already exists).
  report:
    needs: [build, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create fuzz --color B60205 --description "Found by fuzzing" --force
          title="fuzzer-nightly failed on $(date -u +%F)"
          existing=$(gh issue list --label fuzz --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The nightly fuzz run failed: $RUN_URL

          Reproducers and stack traces are attached to the run as \`fuzz-findings-*\` artifacts.
          Add each reproducer as a regression test before deleting it."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label fuzz --body "$body"
          fi
