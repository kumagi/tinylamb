name: tsan
on: [ push, pull_request ]
jobs:
  concurrency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: build and test concurrency subset
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTINYLAMB_ENABLE_TSAN=ON \
            -DTINYLAMB_ENABLE_GOOGLESQL=OFF
          cmake --build build -j"$(nproc)"
          # CamelCase gtest suite names; the old lowercase regex matched zero
          # tests, so the job vacuously passed. Anchored to the suite start:
          # unanchored "Transaction" also pulled in PostgresServerTest
          # TCP-protocol tests, which are not part of the concurrency subset.
          ctest --test-dir build \
            -R '^(LockManager|LockWaitProgress|CacheConcurrent|PagePool|RowPageConcurrent|BPlusTreeConcurrent|Transaction)' \
            -j"$(nproc)" --output-on-failure
          python3 scripts/clean_root_artifacts.py
