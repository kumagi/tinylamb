name: tsan
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  # CamelCase gtest suite names, anchored to the suite start: unanchored
  # "Transaction" also pulled in PostgresServerTest TCP-protocol tests, which
  # are not part of the concurrency subset. Every alternative must name a
  # suite that exists today (deleted suites silently match nothing). These
  # are the suites whose tests spawn threads or exercise latch/MVCC/WAL/
  # budget concurrency. Shared by both jobs so they cannot drift apart.
  TSAN_SUITES: '^(Transaction|WriteIntentWait|CommitPublication|DurabilityBarrier|IndexReservation|QueueTable|FullScanMvccFastPath|PageManager|ParallelWork|SpillStore|Logger|TableTest|MemoryBudget|QueryGrant|QueryParallelismBudget)'

jobs:
  concurrency:
    name: TSan concurrency subset
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: tsan
      - name: configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTINYLAMB_ENABLE_TSAN=ON \
            -DTINYLAMB_ENABLE_GOOGLESQL=OFF
      - name: build
        run: cmake --build build
      # TSAN_OPTIONS is set per test by CMakeLists.txt (detect_deadlocks /
      # die_after_fork), so it is not overridden here.
      - name: test
        run: |
          # Guard against the "regex matches zero tests" failure mode that
          # once made this job pass vacuously.
          n=$(ctest --test-dir build -N -R "$TSAN_SUITES" | sed -nE 's/^Total Tests: ([0-9]+)/\1/p')
          echo "selected $n tests"
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::TSAN_SUITES matched zero tests"; exit 1
          fi
          ctest --test-dir build -R "$TSAN_SUITES" \
            --output-junit "$PWD/build/ctest-junit.xml"
      - name: test summary
        if: always()
        run: python3 .github/scripts/ctest_summary.py build/ctest-junit.xml --title "TSan concurrency subset"
      - name: upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-logs
          path: build/Testing/Temporary/LastTest*.log
          retention-days: 14
      - name: sweep test database artifacts
        if: always()
        run: python3 scripts/clean_root_artifacts.py

  # Lock-order (ABBA) detection needs TSan's deadlock detector, which the job
  # above disables. Advisory until the baseline reports are triaged.
  lock-order:
    name: TSan lock-order (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          ccache-key: tsan-deadlock
      - name: configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTINYLAMB_ENABLE_TSAN=ON \
            -DTINYLAMB_TSAN_DETECT_DEADLOCKS=ON \
            -DTINYLAMB_ENABLE_GOOGLESQL=OFF
      - name: build
        run: cmake --build build
      - name: test with detect_deadlocks=1
        run: |
          ctest --test-dir build -R "$TSAN_SUITES" \
            --output-junit "$PWD/build/ctest-junit.xml"
      - name: test summary
        if: always()
        run: python3 .github/scripts/ctest_summary.py build/ctest-junit.xml --title "TSan lock-order"
      - name: sweep test database artifacts
        if: always()
        run: python3 scripts/clean_root_artifacts.py
