name: clang-format
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI pins clang-format 22 explicitly rather than using the distro
      # default: clang-format (< 19) disagrees on requires-clause indentation,
      # which made this job fail even on empty patches. Run the same pinned
      # version locally to match CI.
      - name: Install clang-format 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-format-22

      - name: Check diff
        run: |
          # Quote the pathspecs: an unquoted *.{...} glob expands against the
          # repo root only, so nested files silently dropped out of the check.
          git ls-files '*.c' '*.h' '*.cc' '*.cpp' '*.hpp' '*.tcc' '*.inc' '*.ipp' '*.inl' | \
            xargs -r -P "$(nproc)" -n 32 clang-format-22 -style=file -i
          if git diff --quiet; then
            echo "### ✅ clang-format clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff > clang-format.patch
          {
            echo "### ❌ clang-format found unformatted files"
            echo
            echo "Fix locally with \`git apply clang-format.patch\` (artifact) or run clang-format-22."
            echo
            git diff --stat | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only | while read -r f; do
            echo "::error file=$f,title=clang-format::$f is not clang-format-22 clean"
          done
          exit 1

      - name: Upload fix-up patch
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-format-patch
          path: clang-format.patch
          retention-days: 7
